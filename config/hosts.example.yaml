# Copy to hosts.yaml. Credentials are taken from environment variables (see .env).
servers:
  - name: dell-01
    vendor: idrac          # idrac | irmc | ilo | ilom | generic  (informational label)
    address: 10.0.0.11
    username_env: DELL01_USER
    password_env: DELL01_PASSWORD
    verify_tls: false      # BMCs usually have self-signed certs

  - name: hpe-01
    vendor: ilo
    address: 10.0.0.12
    username_env: ILO01_USER
    password_env: ILO01_PASSWORD

